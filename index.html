 e.onclick=()=>{Object.assign(st,{cat:'',type:'',se:'',star:false,urgent:false,nego:false,isNew:false,price:false,kw:''},k.f);sync();render();};K.appendChild(e);});
document.getElementById('alert').innerHTML=`<b>이번 회차 핵심</b> — <b>대전 중구 「사회연대경제 혁신모델 마스터 플랜 수립 용역」</b> 신규 등록(9/7, 마감 9/15·9/18 2건). 행안부 2026 사회연대경제 혁신모델 확산사업 선정 지자체 중 마스터플랜 용역 발주 첫 포착. · 경주시 마을호텔학교 2건은 입찰공고 미전환. · 지역역량강화 계열 25건 집중(농어촌공사 지사 발주 다수). · 부산 서구 빈집정비형 도시재생활성화계획 2건(신규 유형).`;
const fc=document.getElementById('fcat');CATS.forEach(c=>{const o=document.createElement('option');o.textContent=c;fc.appendChild(o);});
function sync(){document.getElementById('fcat').value=st.cat;document.getElementById('ftype').value=st.type;document.getElementById('fse').value=st.se;document.getElementById('q').value=st.q;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!!st[c.dataset.f]));
 document.querySelectorAll('.kpi').forEach((e,i)=>{const f=kpis[i].f;e.classList.toggle('on',Object.keys(f).length? Object.entries(f).every(([k,v])=>st[k]===v) : !st.type&&!st.star&&!st.urgent&&!st.nego&&!st.isNew&&!st.price&&!st.cat&&!st.kw);});}
['q','fcat','ftype','fse'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{st[{q:'q',fcat:'cat',ftype:'type',fse:'se'}[id]]=e.target.value;st.kw='';sync();render();}));
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st[c.dataset.f]=!st[c.dataset.f];sync();render();});
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.asc=!st.asc;else{st.sort=k;st.asc=true;}render();});
function filt(){const q=st.q.trim().toLowerCase();return R.filter(r=>(!st.cat||r.cat===st.cat)&&(!st.type||r.type===st.type)&&(!st.se||r.se===st.se)&&(!st.star||r.star)&&(!st.urgent||(r.dday!==null&&r.dday<=3))&&(!st.nego||r.mth==='협상에의한계약')&&(!st.isNew||r.isNew)&&(!st.price||r.isPrice)&&(!st.kw||r.kw.split('/').includes(st.kw))&&(!q||(r.nm+r.inst+r.no+r.kw).toLowerCase().includes(q)));}
function ddCls(d){return d===null?'dn':d<=3?'d0':d<=10?'d1':'d2';}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){let rows=filt();const k=st.sort;rows.sort((a,b)=>{let x=a[k],y=b[k];if(k==='dday'){x=x===null?999:x;y=y===null?999:y;}if(x<y)return st.asc?-1:1;if(x>y)return st.asc?1:-1;return 0;});
 document.getElementById('cnt').textContent=`${rows.length}건 표시`;
 document.getElementById('tb').innerHTML=rows.map(r=>`<tr><td><span class="dd ${ddCls(r.dday)}">${r.dday===null?'미표기':'D-'+r.dday}</span></td><td class="nm">${r.star?'<span class="st">★</span> ':''}${esc(r.nm)}</td><td>${esc(r.inst)}</td><td style="white-space:nowrap">${esc(r.ddl)}</td><td class="no">${r.no}</td><td><span class="tag ${r.type==='발주계획'?'p':r.type==='사전규격'?'s':''}">${r.type}</span>${r.isNew?'<span class="tag n">신규</span>':''}${r.isPrice?'<span class="tag g">가격입찰</span>':''}</td><td>${r.se}</td><td>${esc(r.mth)}</td><td style="font-size:11.5px;color:var(--mute)">${esc(r.kw)}</td><td style="white-space:nowrap;color:var(--mute)">${r.posted}</td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;color:var(--mute);padding:24px">조건에 맞는 공고 없음</td></tr>';}
const KL=document.getElementById('kwlog');
D.log.forEach(([k,raw,inc])=>{const e=document.createElement('div');e.className=raw?'':'z';e.innerHTML=`<span>${k}</span><span>${raw} / <b>${inc}</b></span>`;e.onclick=()=>{Object.assign(st,{cat:'',type:'',se:'',star:false,urgent:false,nego:false,isNew:false,price:false,q:'',kw:k});sync();render();window.scrollTo({top:document.getElementById('q').offsetTop-80,behavior:'smooth'});};KL.appendChild(e);});
document.getElementById('foot').innerHTML=`<b>검증 메모</b> · 원매칭 ${S.raw}건 → 공고번호 기준 중복제거 ${S.uniq}건 → 주제 관련성 필터 제외 ${S.exFilter} / 업무범위 외 ${S.exGlobal} / 마감 경과 ${S.exPast} → 입찰공고 수록 ${S.bid}건. 발주계획 오늘자 ${S.planAll}건(용역 ${S.planSvc}, 키워드 매칭 ${S.planMatch}, 수록 ${S.plan}) · 사전규격 오늘자 ${S.specAll}건(용역 ${S.specSvc}, 매칭 ${S.specMatch}, 수록 ${S.spec}). 「(개찰)」 표기는 입찰마감일시 미기재(협상계약) 건의 개찰예정일시. 「가격입찰」은 계약방법이 적격심사제·소액수의견적·수의시담·제한적최저가·종합낙찰제 등 가격 중심 낙찰 건(협상에의한계약·설계공모 제외). 「신규」는 직전 브리핑(2026-09-04) 이후 게시분(2026-09-05~09-08, 발주계획·사전규격 오늘자 포함). ★는 사업명 기준 기획·계획수립·역량강화 성격 자동 판정. 수집 방식: XHR 후킹으로 확보한 조달청 API 요청 템플릿에 키워드 치환, startIndex/endIndex 페이징. 공고 원문은 나라장터에서 공고번호로 조회.`;
sync();render();
// charts
const catCnt=CATS.map(c=>R.filter(r=>r.cat===c).length);
const catStar=CATS.map(c=>R.filter(r=>r.cat===c&&r.star).length);
new Chart(document.getElementById('c1'),{type:'bar',data:{labels:CATS.map(c=>c.replace('·도시재생·상권','·상권')),datasets:[{label:'★ 관련도 높음',data:catStar,backgroundColor:'#d97706'},{label:'기타 수록',data:catCnt.map((v,i)=>v-catStar[i]),backgroundColor:'#93b4e8'}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',scales:{x:{stacked:true,ticks:{precision:0}},y:{stacked:true,ticks:{font:{size:11}}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}},onClick:(e,el)=>{if(el.length){Object.assign(st,{cat:CATS[el[0].index],type:'',kw:''});sync();render();}}}});
const bins=[['D-0~3',r=>r.dday!==null&&r.dday<=3],['D-4~10',r=>r.dday!==null&&r.dday>3&&r.dday<=10],['D-11~20',r=>r.dday!==null&&r.dday>10&&r.dday<=20],['D-21+',r=>r.dday!==null&&r.dday>20],['미표기',r=>r.dday===null]];
new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:bins.map(b=>b[0]),datasets:[{data:bins.map(b=>bid.filter(b[1]).length),backgroundColor:['#c0392b','#d97706','#2f8f5b','#1f5fbf','#9ca3af']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:11}}}}}});
const topKw=[...D.log].filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]).slice(0,10);
new Chart(document.getElementById('c3'),{type:'bar',data:{labels:topKw.map(x=>x[0]),datasets:[{label:'수록',data:topKw.map(x=>x[2]),backgroundColor:'#1f5fbf'},{label:'원매칭',data:topKw.map(x=>x[1]),backgroundColor:'#dbe4f3'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{precision:0}},x:{ticks:{font:{size:10.5}}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}},onClick:(e,el)=>{if(el.length){Object.assign(st,{cat:'',type:'',kw:topKw[el[0].index][0]});sync();render();}}}});
</script></body></html>
