const fc=document.getElementById('fcat');CATS.forEach(c=>{const o=document.createElement('option');o.textContent=c;fc.appendChild(o);});
function sync(){document.getElementById('fcat').value=st.cat;document.getElementById('ftype').value=st.type;document.getElementById('fse').value=st.se;document.getElementById('q').value=st.q;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!!st[c.dataset.f]));
 document.querySelectorAll('.kpi').forEach((e,i)=>{const f=kpis[i].f;e.classList.toggle('on',Object.keys(f).length? Object.entries(f).every(([k,v])=>st[k]===v) : !st.type&&!st.star&&!st.urgent&&!st.nego&&!st.isNew&&!st.price&&!st.cat&&!st.kw);});}
['q','fcat','ftype','fse'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{st[{q:'q',fcat:'cat',ftype:'type',fse:'se'}[id]]=e.target.value;st.kw='';sync();render();}));
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st[c.dataset.f]=!st[c.dataset.f];sync();render();});
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.asc=!st.asc;else{st.sort=k;st.asc=true;}render();});
function filt(){const q=st.q.trim().toLowerCase();return R.filter(r=>(!st.cat||r.cat===st.cat)&&(!st.type||r.type===st.type)&&(!st.se||r.se===st.se)&&(!st.star||r.star)&&(!st.urgent||(r.dday!==null&&r.dday<=3))&&(!st.nego||r.mth==='협상에의한계약')&&(!st.isNew||r.isNew)&&(!st.price||r.isPrice)&&(!st.kw||r.kw.split('/').includes(st.kw))&&(!q||(r.nm+r.inst+r.no+r.kw).toLowerCase().includes(q)));}
function ddCls(d){return d===null?'dn':d<=3?'d0':d<=10?'d1':'d2';}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){let rows=filt();const k=st.sort;rows.sort((a,b)=>{let x=a[k],y=b[k];if(k==='dday'){x=x===null?999:x;y=y===null?999:y;}if(x<y)return st.asc?-1:1;if(x>y)return st.asc?1:-1;return 0;});
 document.getElementById('cnt').textContent=`${rows.length}건 표시`;
 document.getElementById('tb').innerHTML=rows.map(r=>`<tr><td><span class="dd ${ddCls(r.dday)}">${r.dday===null?'미표기':'D-'+r.dday}</span></td><td class="nm">${r.star?'<span class="st">★</span> ':''}${esc(r.nm)}</td><td>${esc(r.inst)}</td><td style="white-space:nowrap">${esc(r.ddl)}</td><td class="no">${r.no}</td><td><span class="tag ${r.type==='발주계획'?'p':r.type==='사전규격'?'s':''}">${r.type}</span>${r.isNew?'<span class="tag n">신규</span>':''}${r.isPrice?'<span class="tag g">가격입찰</span>':''}</td><td>${r.se}</td><td>${esc(r.mth)}</td><td style="font-size:11.5px;color:var(--mute)">${esc(r.kw)}</td><td style="white-space:nowrap;color:var(--mute)">${r.posted}</td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;color:var(--mute);padding:24px">조건에 맞는 공고 없음</td></tr>';}

D.log.forEach(([k,raw,inc])=>{const e=document.createElement('div');e.className=raw?'':'z';e.innerHTML=`<span>${k}</span><span>${raw} / <b>${inc}</b></span>`;e.onclick=()=>{Object.assign(st,{cat:'',type:'',se:'',star:false,urgent:false,nego:false,isNew:false,price:false,q:'',kw:k});sync();render();window.scrollTo({top:document.getElementById('q').offsetTop-80,behavior:'smooth'});};KL.appendChild(e);});
